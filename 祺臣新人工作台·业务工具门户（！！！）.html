<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>祺臣机械 · 新人业务工作台账</title>
<style>
:root{
--page:#f1f5f9;--panel:#fff;--line:#e2e8f0;--ink:#1e293b;--sub:#64748b;
--brand:#0f766e;--brand2:#115e59;--brand-l:#ccfbf1;--deep:#134e4a;
--gold:#b45309;--gold-l:#fef3c7;--red:#b91c1c;--red-l:#fee2e2;
--ok:#15803d;--ok-l:#dcfce7;--blue:#1d4ed8;--blue-l:#dbeafe;--purple:#7c3aed;--purple-l:#ede9fe;
--side-w:250px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Segoe UI","Microsoft YaHei",sans-serif;background:var(--page);color:var(--ink);display:flex;flex-direction:column}
/* 顶部 */
header{background:linear-gradient(135deg,var(--deep),var(--brand) 55%,#0d9488);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;flex-shrink:0}
header h1{font-size:19px;letter-spacing:.5px}
header h1 small{font-size:12px;opacity:.85;font-weight:400;margin-left:10px}
.redlines{display:flex;gap:8px;flex-wrap:wrap}
.redlines span{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);border-radius:14px;padding:3px 11px;font-size:11.5px}
/* 主体布局 */
.layout{display:flex;flex:1;min-height:0}
/* 侧边导航 */
aside{width:var(--side-w);background:#0f2e2b;color:#cbd5e1;overflow-y:auto;flex-shrink:0;padding:12px 10px}
aside .grp{font-size:11px;letter-spacing:1px;color:#6ee7b7;font-weight:700;margin:14px 8px 6px;text-transform:uppercase}
aside .grp:first-child{margin-top:2px}
aside button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;border:none;color:#cbd5e1;font-size:13.5px;padding:9px 10px;border-radius:9px;cursor:pointer;font-family:inherit;transition:.15s}
aside button:hover{background:rgba(255,255,255,.08);color:#fff}
aside button.on{background:var(--brand);color:#fff;font-weight:600}
aside button .ico{width:20px;text-align:center;flex-shrink:0}
aside a.dl{display:flex;align-items:center;gap:8px;color:#fbbf24;font-size:13px;padding:9px 10px;border-radius:9px;text-decoration:none;border:1px dashed rgba(251,191,36,.5);margin:6px 0}
aside a.dl:hover{background:rgba(251,191,36,.1)}
/* 主内容区 */
main{flex:1;min-width:0;display:flex;flex-direction:column}
.framebar{display:flex;align-items:center;gap:10px;background:#fff;border-bottom:1px solid var(--line);padding:9px 16px;flex-shrink:0}
.framebar .ft{font-weight:700;color:var(--brand2);font-size:14.5px}
.framebar .fd{font-size:12px;color:var(--sub)}
.framebar .open{margin-left:auto;font-size:12px;color:var(--brand);text-decoration:none;border:1px solid var(--brand);border-radius:8px;padding:4px 12px;white-space:nowrap}
.framebar .open:hover{background:var(--brand-l)}
iframe{flex:1;width:100%;border:none;background:#fff}
/* 落地页 */
.landing{flex:1;overflow-y:auto;padding:24px 28px}
.landing h2{font-size:20px;color:var(--brand2);margin-bottom:4px}
.landing .sub{font-size:13px;color:var(--sub);margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(15,23,42,.06)}
.card h3{font-size:15px;color:var(--brand2);border-left:4px solid var(--brand);padding-left:9px;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{background:var(--brand-l);color:var(--brand2);white-space:nowrap}
tr:nth-child(even) td{background:#f8fafc}
.tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:10px;white-space:nowrap}
.t-brand{background:var(--brand-l);color:var(--brand2)}.t-gold{background:var(--gold-l);color:var(--gold)}
.t-red{background:var(--red-l);color:var(--red)}.t-ok{background:var(--ok-l);color:var(--ok)}
.t-blue{background:var(--blue-l);color:var(--blue)}.t-purple{background:var(--purple-l);color:var(--purple)}
.note{background:var(--brand-l);border-left:4px solid var(--brand);padding:10px 14px;border-radius:6px;font-size:13px;margin:10px 0}
.rednote{background:var(--red-l);border-left:4px solid var(--red);padding:10px 14px;border-radius:6px;font-size:13px;margin:10px 0}
.goldnote{background:var(--gold-l);border-left:4px solid var(--gold);padding:10px 14px;border-radius:6px;font-size:13px;margin:10px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}
.path{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.path .p{background:var(--brand-l);border:1px solid var(--brand);color:var(--brand2);border-radius:9px;padding:7px 13px;font-size:12.5px;font-weight:600}
.path .ar{color:var(--brand);font-weight:700}
.btn{background:var(--brand);color:#fff;border:none;border-radius:9px;padding:9px 18px;font-size:13.5px;cursor:pointer;font-family:inherit;margin:6px 6px 0 0}
.btn:hover{background:var(--brand2)}
footer{background:#fff;border-top:1px solid var(--line);text-align:center;color:var(--sub);font-size:11.5px;padding:9px;flex-shrink:0}
</style>
</head>
<body>
<header>
<h1>祺臣机械 · 新人业务工作台账<small>New Sales Onboarding Hub ｜ 9 大工具一站集成 ｜ v1.0</small></h1>
<div class="redlines">
<span>① 参数有出处·不编造</span><span>② 净产出70–80%·不夸大</span><span>③ 折扣/交期/账期·老板拍板</span>
</div>
</header>
<div class="layout">
<aside>

<button data-id="learn"><span class="ico">🎓</span>新人学习系统</button>

<button data-id="persona"><span class="ico">👥</span>客户画像·跟进指南</button>
<button data-id="catalog"><span class="ico">📖</span>询盘产品目录册</button>

<button data-id="layout"><span class="ico">🏭</span>厂房规划问答·案例</button>
<button data-id="pi"><span class="ico">🧾</span>全机型PI单模板</button>
<a class="dl" href="祺臣客户询盘产品目录册·表格模板.xlsx" download><span class="ico">📥</span>目录册表格模板(.xlsx)</a>
<div class="grp">⚙️ 跑流程（照SOP）</div>
<button data-id="sop"><span class="ico">🔄</span>业务SOP全流程卡片</button>
<div class="grp">📊 盯执行（日出单）</div>
<button data-id="daily"><span class="ico">📝</span>新人日报系统</button>
</aside>
<main>
<div class="framebar" id="framebar" style="display:none">
<span class="ft" id="fbTitle"></span>
<span class="fd" id="fbDesc"></span>
<a class="open" id="fbOpen" href="#" target="_blank">↗ 新窗口打开</a>
</div>
<iframe id="frame" style="display:none" title="tool"></iframe>
<div class="landing" id="landing"></div>
</main>
</div>
<footer>祺臣机械 · 新人业务工作台账 ｜ 数据以 MEMORY.md 为唯一事实源 ｜ 价格为挂牌参考价，成交以老板确认为准 ｜ 编制：祺工</footer>
<script>
var TOOLS={
 learn:{name:'新人学习系统',file:'祺臣新人学习系统.html',desc:'5周7关学习地图+题库+模拟考，打牢机械知识底子'},
 q100:{name:'专业知识100问·行业案例',file:'祺臣专业知识100问·行业案例学习系统.html',desc:'100道必答题+12个行业实战案例，随查随背'},
 persona:{name:'客户画像·跟进指南',file:'祺臣客户画像模型与跟进指南.html',desc:'四类画像+高质量问题+画像模板+分级工具，认清客户再开口'},
 catalog:{name:'客户询盘产品目录册',file:'祺臣客户询盘产品目录册.html',desc:'全机型实拍图+多维对比+智能选型+一键生成中英PPT目录册'},
 layout:{name:'厂房规划问答·案例模板',file:'祺臣厂房摆放规划·问答卡片与案例模板.html',desc:'12张厂房问答卡+面积估算器+案例模板，帮客户规划场地'},
 pi:{name:'全机型PI单模板',file:'祺臣全机型一体式PI单模板.html',desc:'智能选型快生成+整线报价+条款库，输入参数直接出PI'},
 sop:{name:'业务SOP全流程卡片',file:'祺臣业务SOP全流程一体化卡片.html',desc:'售前→售中→交付→售后12阶段标准动作+异常预案+KPI'},
 daily:{name:'新人日报系统',file:'祺臣新人日报系统.html',desc:'AI任务引擎+老询盘跟进提醒+日报填写，每日驱动开单'}
};
var CAT_DESC={
 home:'先读这里：上手路径与工具速查',learn:'学知识',q100:'学知识',
 persona:'认客户',catalog:'认客户',layout:'做方案',pi:'做方案',
 sop:'跑流程',daily:'盯执行'};
var cur='home';
function show(id){
 cur=id;
 document.querySelectorAll('aside button').forEach(function(b){b.classList.toggle('on',b.dataset.id===id)});
 var fr=document.getElementById('frame'),bar=document.getElementById('framebar'),land=document.getElementById('landing');
 if(id==='home'){fr.style.display='none';bar.style.display='none';land.style.display='block';renderLanding();return;}
 var t=TOOLS[id];if(!t)return;
 fr.src=encodeURI(t.file);
 fr.style.display='block';bar.style.display='flex';land.style.display='none';
 document.getElementById('fbTitle').textContent=t.name;
 document.getElementById('fbDesc').textContent=t.desc;
 document.getElementById('fbOpen').href=encodeURI(t.file);
}
document.querySelectorAll('aside button').forEach(function(b){b.addEventListener('click',function(){show(b.dataset.id)})});
/* show('home') 在 renderLanding 定义后调用，见下一脚本块 */
</script>

 document.getElementById('landing').innerHTML=

 '<tr><td>客户问机器参数/原理/材料</td><td><span class="tag t-blue">专业知识100问</span></td><td>搜题号照着答，不会的标「需技术部确认」</td></tr>'+

 '<div class="note">先信任，后成交。你发出的每一封邮件、每一份报价，都要经得起「参数有出处、产能不夸大、让步守边界」三条检验。机器是帮客户赚钱的工具——把客户的账算清楚，订单自然来。遇到答不上的问题不丢人，升级给工厂工程师才是专业。</div></div>';

</body>
